<!doctype html>
<!-- Link-preview card (1200×630) for Open Graph / Twitter. Rendered by scripts/og-image.mjs → public/og-image.jpg -->
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "SG"; src: url("../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"); font-weight: 100 900; }
@font-face { font-family: "JBM"; src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"); font-weight: 100 800; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
    display: grid;
    grid-template-columns: 56px 1fr 470px;
    background: #0f0e0e;
    color: #fbf5f3;
    font-family: "Inter", sans-serif;
}
.band { background: linear-gradient(180deg, #9ab5a9, #8daa9d 45%, #7d998c); }
.text { display: flex; flex-direction: column; justify-content: center; padding: 0 40px 0 64px; }
.eyebrow { font-family: "JBM", monospace; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8a4a3; }
h1 { margin: 14px 0 22px; font-family: "SG", sans-serif; font-size: 92px; line-height: 1; letter-spacing: -0.02em; color: #8daa9d; }
.rule { width: 96px; height: 4px; background: #7b0828; margin-bottom: 28px; }
ul { list-style: none; margin: 0; padding: 0; font-size: 28px; line-height: 1.5; }
li::before { content: "– "; color: #a8a4a3; }
.url { margin-top: 36px; font-family: "JBM", monospace; font-size: 24px; color: #8daa9d; }
.photo { display: flex; align-items: center; padding-right: 56px; }
.photo img { width: 414px; height: 414px; object-fit: cover; border-radius: 18px; border: 1px solid #2e3532; }
</style>
</head>
<body>
    <div class="band"></div>
    <div class="text">
        <div class="eyebrow">Robotics &amp; Mechanical Engineering</div>
        <h1>Marcus Gafka</h1>
        <div class="rule"></div>
        <ul>
            <li>WPI Robotics + ME student</li>
            <li>DEKA Research &amp; NASA JSC intern</li>
            <li>FRC Team 190 mentor &amp; drive coach</li>
        </ul>
        <div class="url">marcusgafka.com</div>
    </div>
    <div class="photo"><img src="../../public/assets/projects/doom-spiral-turnover/robot.jpg" alt="" /></div>
</body>
</html>
